# Don't forget to run `pnpm exec lefthook install` to install the hooks

assert_lefthook_installed: true
min_version: 2.2.2
glob_matcher: doublestar

# Validate staged content before committing
pre-commit:
  piped: true
  commands:
    lint-and-format:
      run: pnpm fix -- {staged_files}
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,md,mdx,yaml,yml}"
      stage_fixed: true
      priority: 1
    type-check:
      run: pnpm check:types
      glob:
        - "**/*.{ts,tsx,mts,cts}"
        - "tsconfig.json"
        - "package.json"
        - "pnpm-lock.yaml"
      priority: 2

# Validate commit messages
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit '{1}'
