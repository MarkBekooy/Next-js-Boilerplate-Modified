# Don't forget to run `pnpx lefthook install` to install the hooks

# Validate staged content before committing
pre-commit:
  commands:
    lint-fix:
      run: pnpm fix -- {staged_files}
      glob:
        - "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
        - "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      stage_fixed: true
      priority: 1
    format:
      run: pnpm exec oxfmt {staged_files}
      glob:
        - "*.{json,jsonc,css}"
        - "**/*.{json,jsonc,css}"
      stage_fixed: true
      priority: 1
    type-check:
      run: pnpm check:types
      glob:
        - "*.{ts,tsx,mts,cts}"
        - "**/*.{ts,tsx,mts,cts}"
      priority: 2

# Validate commit messages
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint < $(git rev-parse --git-path COMMIT_EDITMSG)
